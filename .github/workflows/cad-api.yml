name: CAD API / Rust (offline)

on:
  push:
    branches: [main, feature/issue-1-python-interface]
  pull_request:
  workflow_dispatch:

jobs:
  verify-rust-cad-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust CAD domain and adapter tests
        run: cargo test --manifest-path rust-facade/Cargo.toml --all-targets
      - name: Generate semantic CAD script
        run: cargo run --manifest-path rust-facade/Cargo.toml --bin cad_plate
      - name: Validate generated JSON
        run: jq empty output/cad-plate.json
      - name: Compare generated CAD plan with fixture
        run: diff -u <(jq -S . fixtures/plate-top-face.json) <(jq -S . output/cad-plate.json)
