name: SCRF Rust offline and SCPF comparison

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-rust-cad-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust CAD domain and adapter tests
        run: cargo test --manifest-path scrf/Cargo.toml --all-targets
      - name: Generate semantic CAD script
        run: cargo run --manifest-path scrf/Cargo.toml --example plate
      - name: Validate generated JSON
        run: jq empty output/examples/plate/scrf/solidcraft.json
      - name: Fixture matches generated CAD plan
        shell: bash
        run: |
          set -euo pipefail
          jq -e -s '.[0] == .[1]' \
            examples/plate/scrf/solidcraft.json \
            output/examples/plate/scrf/solidcraft.json >/dev/null

      - name: Generate CSG cube script from clean Rust model
        run: cargo run --manifest-path scrf/Cargo.toml --example csg_cube
      - name: CSG cube output is valid and matches reviewed SolidCraft plan
        shell: bash
        run: |
          set -euo pipefail
          jq empty output/examples/csg-cube/scrf/solidcraft.json
          jq -e -s '.[0] == .[1]' \
            examples/csg-cube/scrf/solidcraft.json \
            output/examples/csg-cube/scrf/solidcraft.json >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SCPF Python regression tests
        env:
          PYTHONPATH: scpf
        run: python -m unittest discover -s scpf/tests -v
      - name: Generate Python SCPF command plans
        env:
          PYTHONPATH: scpf
        run: |
          python -m scpf examples/plate/scpf/model.py --out output/examples/plate/scpf/solidcraft.json
          python -m scpf examples/csg-cube/scpf/model.py --out output/examples/csg-cube/scpf/solidcraft.json
      - name: Compare SCPF and Rust native command plans
        shell: bash
        run: |
          set -euo pipefail
          for model in plate csg-cube; do
            jq -e -s '.[0] == .[1]' \
              "output/examples/$model/scrf/solidcraft.json" \
              "output/examples/$model/scpf/solidcraft.json" > /dev/null
          done

      - name: Show and identify generated command plans
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{source_commit:$commit, workflow_run:$run, artifacts:["plate/scrf/solidcraft.json","csg-cube/scrf/solidcraft.json","plate/scpf/solidcraft.json","csg-cube/scpf/solidcraft.json"]}' \
            > output/examples/build.json
          echo "--- Plate commands ---"
          jq . output/examples/plate/scrf/solidcraft.json
          echo "--- CSG cube commands ---"
          jq . output/examples/csg-cube/scrf/solidcraft.json
      - name: Retain generated SCRF and SCPF JSON as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrf-scpf-bld-json
          path: |
            output/examples/plate/scrf/solidcraft.json
            output/examples/csg-cube/scrf/solidcraft.json
            output/examples/plate/scpf/solidcraft.json
            output/examples/csg-cube/scpf/solidcraft.json
            output/examples/build.json
          if-no-files-found: error
