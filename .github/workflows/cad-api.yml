name: Rust CAD API offline

on:
  push:
    branches:
      - main
      - 'feature/issue-1-python-interface'
  workflow_dispatch: {}

jobs:
  verify-rust-cad-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust CAD domain and adapter tests
        run: cargo test --manifest-path solidcraftforge/Cargo.toml --all-targets
      - name: Generate semantic CAD script
        run: cargo run --manifest-path solidcraftforge/Cargo.toml --example plate
      - name: Validate generated JSON
        run: jq empty output/examples/plate/solidcraftforge/solidcraft.json
      - name: Fixture matches generated CAD plan
        shell: bash
        run: |
          set -euo pipefail
          jq -e -s '.[0] == .[1]' \
            examples/plate/solidcraftforge/solidcraft.json \
            output/examples/plate/solidcraftforge/solidcraft.json >/dev/null

      - name: Generate CSG cube script from clean Rust model
        run: cargo run --manifest-path solidcraftforge/Cargo.toml --example csg_cube
      - name: CSG cube output is valid and matches reviewed SolidCraft plan
        shell: bash
        run: |
          set -euo pipefail
          jq empty output/examples/csg-cube/solidcraftforge/solidcraft.json
          jq -e -s '.[0] == .[1]'             examples/csg-cube/solidcraftforge/solidcraft.json             output/examples/csg-cube/solidcraftforge/solidcraft.json >/dev/null
