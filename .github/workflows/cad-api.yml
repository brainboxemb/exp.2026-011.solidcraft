name: Rust CAD API offline

on:
  push:
    branches:
      - main
      - 'feature/issue-1-python-interface'
  workflow_dispatch: {}

jobs:
  verify-rust-cad-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust CAD domain and adapter tests
        run: cargo test --manifest-path rust-facade/Cargo.toml --all-targets
      - name: Generate semantic CAD script
        run: cargo run --manifest-path rust-facade/Cargo.toml --example plate
      - name: Validate generated JSON
        run: jq empty output/cad-plate.json
      - name: Fixture matches generated CAD plan
        shell: bash
        run: |
          set -euo pipefail
          jq -e -s '.[0] == .[1]' \
            fixtures/plate-top-face.json \
            output/cad-plate.json >/dev/null
