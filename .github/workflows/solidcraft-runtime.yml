name: SolidCraft 0.30.1 native qualification (SCPF Python)

on:
  push:
    branches:
      - main
    paths:
      - "scpf/**"
      - "examples/**"
      - "site/**"
      - "scripts/ci/**"
      - ".github/workflows/solidcraft-runtime.yml"
  pull_request:
    branches:
      - main
    types: [ready_for_review, synchronize, reopened]
    paths:
      - "scpf/**"
      - "examples/**"
      - "site/**"
      - "scripts/ci/**"
      - ".github/workflows/solidcraft-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: solidcraft-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-solidcraft:
    # Draft PR commits are never native-qualified; manual dispatch and main are allowed.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLIDCRAFT_VERSION: "0.30.1"
      SOLIDCRAFT_GPU: cpu
    steps:
      - name: Check out experiment
        uses: actions/checkout@v4
      - name: Prepare output directories
        run: mkdir -p output/native/command-plans
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python SCPF models to native commands
        env:
          PYTHONPATH: scpf
        run: |
          python -m unittest discover -s scpf/tests -v
          python -m scpf examples/plate/scpf/model.py --out output/native/command-plans/plate.json
          python -m scpf examples/csg-cube/scpf/model.py --out output/native/command-plans/csg-cube.json
          python -m scpf examples/bracket/scpf/model.py --out output/native/command-plans/bracket-scpf.json
          jq -e -s '.[0] == .[1]' \
            examples/bracket/scpf/solidcraft.json \
            output/native/command-plans/bracket-scpf.json >/dev/null
          jq -e '[.commands[] | select(.command == "solid.hole")] | length == 4' \
            output/native/command-plans/plate.json
          jq -e -s '.[0] == .[1]' \
            examples/csg-cube/scpf/reference.json \
            output/native/command-plans/csg-cube.json >/dev/null
      - name: Fetch and verify official Linux SolidCraft release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          ARCHIVE="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$BASE/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$BASE/$ARCHIVE" --output "$ARCHIVE"
          grep -F " $ARCHIVE" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$ARCHIVE"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Check executable and version
        shell: bash
        run: |
          set -euo pipefail
          command -v solidcraft-cli
          solidcraft-cli --version
      - name: Evaluate semantic plate model with strict SolidCraft parameter checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/native
          solidcraft-cli run output/native/command-plans/plate.json \
            --param-check strict \
            --results \
            --json-out output/native/plate-results.json \
            --save output/native/plate.sc \
            --out output/native/plate.step
          solidcraft-cli eval output/native/plate.sc --json-out output/native/plate-measurements.json
          jq empty output/native/plate-results.json
          jq empty output/native/plate-measurements.json
          test -s output/native/plate.sc
          test -s output/native/plate.step
          jq -e '
            .body_count == 1
            and .bodies[0].name == "Plate"
            and .bodies[0].closed == true
            and .bodies[0].face_types.cylinder == 8
            and .bodies[0].face_types.plane == 6
            and .bodies[0].bbox.min[0] > -50.0001 and .bodies[0].bbox.min[0] < -49.9999
            and .bodies[0].bbox.max[0] > 49.9999 and .bodies[0].bbox.max[0] < 50.0001
            and .bodies[0].bbox.min[1] > -30.0001 and .bodies[0].bbox.min[1] < -29.9999
            and .bodies[0].bbox.max[1] > 29.9999 and .bodies[0].bbox.max[1] < 30.0001
            and .bodies[0].bbox.min[2] > -0.0001 and .bodies[0].bbox.min[2] < 0.0001
            and .bodies[0].bbox.max[2] > 9.9999 and .bodies[0].bbox.max[2] < 10.0001
            and .total.volume_mm3 > 57954 and .total.volume_mm3 < 57956
            and (.timeline | all(.error == null))
          ' output/native/plate-measurements.json
          cat output/native/plate-measurements.json
      - name: Inspect native Hole features and entry points
        shell: bash
        run: |
          set -euo pipefail
          unzip -p output/native/plate.sc document.json > output/native/plate-document.json
          jq -e '
            ([.features[] | select(.type == "hole")] | length) == 4
            and ([.features[] | select(.type == "hole") | .position] ==
                 [[-35, -15, 10], [35, -15, 10],
                  [35, 15, 10], [-35, 15, 10]])
          ' output/native/plate-document.json
      - name: Rebuild from saved native design history
        shell: bash
        run: |
          set -euo pipefail
          solidcraft-cli script output/native/plate.sc --out output/native/plate-repro.json
          solidcraft-cli eval output/native/plate-repro.json --json-out output/native/plate-repro-measurements.json
          jq empty output/native/plate-repro.json
          jq empty output/native/plate-repro-measurements.json
          jq -e -s '
            .[0].body_count == .[1].body_count
            and .[0].total.volume_mm3 == .[1].total.volume_mm3
            and .[0].bodies[0].bbox == .[1].bodies[0].bbox
          ' output/native/plate-measurements.json output/native/plate-repro-measurements.json
      - name: Change thickness parameter and verify associative rebuild
        shell: bash
        run: |
          set -euo pipefail
          cat > output/native/change-thickness.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{"name":"thickness","expression":"15 mm"}}
          ]}
          JSON
          solidcraft-cli run output/native/change-thickness.json \
            --in output/native/plate.sc \
            --param-check strict \
            --save output/native/plate-thick.sc \
            --out output/native/plate-thick.step
          solidcraft-cli eval output/native/plate-thick.sc --json-out output/native/plate-thick-measurements.json
          jq -e '
            .body_count == 1
            and .bodies[0].bbox.max[2] > 14.9999
            and .bodies[0].bbox.max[2] < 15.0001
            and .total.volume_mm3 > 86931
            and .total.volume_mm3 < 86934
            and (.timeline | all(.error == null))
          ' output/native/plate-thick-measurements.json
          unzip -p output/native/plate-thick.sc document.json > output/native/plate-thick-document.json
          jq -e '
            (.params | any(
              .name == "thickness"
              and .expr == "15 mm"
              and .unit == "mm"
            ))
            and ([.features[] | select(.type == "hole")] | length) == 4
          ' output/native/plate-thick-document.json
      - name: Verify attached Hole pattern as one editable sketch cut
        env:
          PYTHONPATH: scpf
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/native/anchored-holes
          python -m scpf examples/anchored-holes/scpf/model.py \
            --out output/native/anchored-holes/commands.json
          jq -e '
            [.commands[] | select(.command == "sketch.create") | .params.name]
              == ["Base", "Holes"]
            and ([.commands[] | select(.command == "sketch.circle.center")] | length) == 2
            and ([.commands[] | select(.command == "solid.hole")] | length) == 0
            and .commands[-1].command == "solid.extrude"
            and .commands[-1].params.operation == "cut"
          ' output/native/anchored-holes/commands.json
          solidcraft-cli run output/native/anchored-holes/commands.json \
            --param-check strict --results \
            --json-out output/native/anchored-holes/results.json \
            --save output/native/anchored-holes/model.sc \
            --out output/native/anchored-holes/model.step
          solidcraft-cli eval output/native/anchored-holes/model.sc \
            --json-out output/native/anchored-holes/measurements.json
          jq -e '
            .body_count == 1
            and .bodies[0].closed == true
            and .bodies[0].bbox.max[0] > 99.9999
            and .bodies[0].bbox.max[1] > 59.9999
            and .bodies[0].bbox.max[2] > 9.9999
            and .total.volume_mm3 > 58993
            and .total.volume_mm3 < 58996
            and (.timeline | all(.error == null))
          ' output/native/anchored-holes/measurements.json
          unzip -p output/native/anchored-holes/model.sc document.json \
            > output/native/anchored-holes/document.json
          jq -e '
            [.features[] | select(.type == "sketch") | .name] == ["Base", "Holes"]
            and ([.features[] | select(.type == "hole")] | length) == 0
            and [.features[].type] == ["sketch", "extrude", "sketch", "extrude"]
          ' output/native/anchored-holes/document.json
      - name: Evaluate CSG cube through native SolidCraft
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/native/csg-cube
          solidcraft-cli run output/native/command-plans/csg-cube.json \
            --param-check strict \
            --results \
            --json-out output/native/csg-cube/results.json \
            --save output/native/csg-cube/model.sc \
            --out output/native/csg-cube/model.step
          solidcraft-cli eval output/native/csg-cube/model.sc \
            --json-out output/native/csg-cube/measurements.json
          jq -e '
            .body_count == 1
            and .bodies[0].name == "CsgCube"
            and .bodies[0].closed == true
            and .bodies[0].faces == 13
            and .bodies[0].face_types.plane == 6
            and .bodies[0].face_types.cylinder == 6
            and .bodies[0].face_types.sphere == 1
            and .total.volume_mm3 > 36624
            and .total.volume_mm3 < 36627
            and .bodies[0].bbox.min[0] > -25.0001
            and .bodies[0].bbox.min[0] < -24.9999
            and .bodies[0].bbox.max[0] > 24.9999
            and .bodies[0].bbox.max[0] < 25.0001
            and .bodies[0].bbox.min[1] > -25.0001
            and .bodies[0].bbox.min[1] < -24.9999
            and .bodies[0].bbox.max[1] > 24.9999
            and .bodies[0].bbox.max[1] < 25.0001
            and .bodies[0].bbox.min[2] > -25.0001
            and .bodies[0].bbox.min[2] < -24.9999
            and .bodies[0].bbox.max[2] > 24.9999
            and .bodies[0].bbox.max[2] < 25.0001
            and (.timeline | all(.error == null))
          ' output/native/csg-cube/measurements.json
          test -s output/native/csg-cube/model.sc
          test -s output/native/csg-cube/model.step
          cat output/native/csg-cube/measurements.json
      - name: Evaluate Bracket with native SolidCraft and inspect BRep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/native/bracket
          solidcraft-cli run output/native/command-plans/bracket-scpf.json \
            --param-check strict \
            --results \
            --json-out output/native/bracket/results.json \
            --save output/native/bracket/model.sc \
            --out output/native/bracket/model.step
          solidcraft-cli eval output/native/bracket/model.sc \
            --json-out output/native/bracket/measurements.json
          jq -e '
            .body_count == 1
            and .bodies[0].name == "Bracket"
            and .bodies[0].closed == true
            and .bodies[0].bbox.min[0] > -0.0001
            and .bodies[0].bbox.max[0] < 40.0001
            and .bodies[0].bbox.min[1] < -59.9999
            and .bodies[0].bbox.max[1] > -0.0001
            and .bodies[0].bbox.min[2] < -29.9999
            and .bodies[0].bbox.max[2] > -0.0001
            and (.timeline | all(.error == null))
          ' output/native/bracket/measurements.json
          test -s output/native/bracket/model.sc
          test -s output/native/bracket/model.step
          cat output/native/bracket/measurements.json
      - name: Render native Bracket reference
        shell: bash
        run: |
          set -euo pipefail
          solidcraft-cli snapshot output/native/bracket/model.sc \
            --out output/native/bracket/model.png \
            --no-grid --no-axes
          test -s output/native/bracket/model.png
      - name: Qualify reconstructed SamplePlate in native SolidCraft
        env:
          PYTHONPATH: scpf
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/native/sample-plate
          python -m scpf examples/sample-plate/scpf/model.py \
            --out output/native/command-plans/sample-plate.json
          solidcraft-cli run output/native/command-plans/sample-plate.json \
            --param-check strict --results \
            --json-out output/native/sample-plate/results.json \
            --save output/native/sample-plate/model.sc \
            --out output/native/sample-plate/model.step
          solidcraft-cli eval output/native/sample-plate/model.sc \
            --json-out output/native/sample-plate/measurements.json
          jq -e '
            .body_count == 1
            and .bodies[0].name == "SamplePlate"
            and .bodies[0].closed == true
            and .bodies[0].bbox.min[0] > -0.0001
            and .bodies[0].bbox.max[0] > 79.9999
            and .bodies[0].bbox.min[1] > -0.0001
            and .bodies[0].bbox.max[1] > 49.9999
            and .bodies[0].bbox.min[2] > -0.0001
            and .bodies[0].bbox.max[2] > 21.9999
            and .bodies[0].bbox.max[2] < 22.0001
            and (.timeline | all(.error == null))
          ' output/native/sample-plate/measurements.json
          test -s output/native/sample-plate/model.sc
          test -s output/native/sample-plate/model.step
          # This model intentionally reproduces the original sketch history.
          unzip -p output/native/sample-plate/model.sc document.json \
            > output/native/sample-plate/document.json
          jq -e '
            [.features[].type] ==
              ["sketch", "extrude", "fillet", "sketch", "extrude",
               "sketch", "extrude", "sketch", "extrude"]
            and [.features[] | select(.type == "sketch") | .name]
              == ["Base", "Holes", "Boss", "Bore"]
            and [.features[] | select(.type == "extrude") | .name]
              == ["Extrude1", "Holes", "Boss", "Bore"]
            and ([.features[] | select(.type == "hole")] | length) == 0
          ' output/native/sample-plate/document.json
          solidcraft-cli snapshot output/native/sample-plate/model.sc \
            --out output/native/sample-plate/model.png \
            --no-grid --no-axes
          test -s output/native/sample-plate/model.png
          cat output/native/sample-plate/measurements.json
      - name: Qualify reconstructed Plastic Enclosure in native SolidCraft
        env:
          PYTHONPATH: scpf
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/native/plastic-enclosure
          python -m scpf examples/plastic-enclosure/scpf/model.py \
            --out output/native/command-plans/plastic-enclosure.json
          solidcraft-cli run output/native/command-plans/plastic-enclosure.json \
            --param-check strict --results \
            --json-out output/native/plastic-enclosure/results.json \
            --save output/native/plastic-enclosure/model.sc \
            --out output/native/plastic-enclosure/model.step
          solidcraft-cli eval output/native/plastic-enclosure/model.sc \
            --json-out output/native/plastic-enclosure/measurements.json
          jq -e '
            .body_count == 1
            and .bodies[0].name == "Enclosure"
            and .bodies[0].closed == true
            and .bodies[0].bbox.min == [-40, -25, 0]
            and .bodies[0].bbox.max == [40, 25, 32]
            and (.sketches | length) == 1
            and (.timeline | all(.error == null))
          ' output/native/plastic-enclosure/measurements.json
          test -s output/native/plastic-enclosure/model.sc
          test -s output/native/plastic-enclosure/model.step
          unzip -p output/native/plastic-enclosure/model.sc document.json \
            > output/native/plastic-enclosure/document.json
          jq -e '
            [.features[].type] ==
              ["sketch", "extrude", "shell", "lip", "snap_fit", "boss", "boss", "rest"]
            and [.features[].name] ==
              ["Enclosure footprint", "Extrude1", "Shell1", "Lip1",
               "SnapFit1", "Boss1", "Boss2", "Rest1"]
          ' output/native/plastic-enclosure/document.json
          solidcraft-cli snapshot output/native/plastic-enclosure/model.sc \
            --out output/native/plastic-enclosure/model.png \
            --no-grid --no-axes
          test -s output/native/plastic-enclosure/model.png
          cat output/native/plastic-enclosure/measurements.json
      - name: Qualify history policy and explicit Sketch experiment
        env:
          PYTHONPATH: scpf
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/native/history-policy
          python -m scpf examples/history-policy/scpf/model.py \
            --out output/native/history-policy/commands.json
          jq -e '
            ([.commands[] | select(.command == "plastic.boss")] | length) == 1
            and ([.commands[] | select(.command == "sketch.create") | .params.name]
              == ["HistoryPolicyBoss footprint", "Boss", "Boss hole", "Explicit pad"])
            and ([.commands[] | select(.command == "solid.extrude")] | length) == 4
          ' output/native/history-policy/commands.json
          solidcraft-cli run output/native/history-policy/commands.json \
            --param-check strict --results \
            --json-out output/native/history-policy/results.json \
            --save output/native/history-policy/model.sc \
            --out output/native/history-policy/model.step
          solidcraft-cli eval output/native/history-policy/model.sc \
            --json-out output/native/history-policy/measurements.json
          jq -e '
            .body_count == 1
            and .bodies[0].name == "HistoryPolicyBoss"
            and .bodies[0].closed == true
            and (.sketches | length) == 4
            and (.timeline | all(.error == null))
          ' output/native/history-policy/measurements.json
          unzip -p output/native/history-policy/model.sc document.json \
            > output/native/history-policy/document.json
          jq -e '
            [.features[].type] ==
              ["sketch", "extrude", "boss",
               "sketch", "extrude", "sketch", "extrude",
               "sketch", "extrude"]
            and [.features[] | select(.type == "sketch") | .name]
              == ["HistoryPolicyBoss footprint", "Boss", "Boss hole", "Explicit pad"]
          ' output/native/history-policy/document.json
          test -s output/native/history-policy/model.sc
          test -s output/native/history-policy/model.step

      - name: Qualify Plastic Enclosure Pi in native SolidCraft
        env:
          PYTHONPATH: scpf
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/native/plastic-enclosure-pi
          python -m scpf examples/plastic-enclosure-pi/scpf/model.py \
            --out output/native/plastic-enclosure-pi/commands.json
          jq -e '
            [.commands[] | select(.command == "sketch.create") | .params.name]
              == ["PlasticEnclosurePi footprint", "USB port"]
            and ([.commands[] | select(.command == "plastic.boss")] | length) == 4
            and ([.commands[] | select(
              .command == "solid.extrude"
              and .params.name == "USB port"
              and .params.operation == "cut"
              and .params.through_all == true
            )] | length) == 1
          ' output/native/plastic-enclosure-pi/commands.json
          solidcraft-cli run output/native/plastic-enclosure-pi/commands.json \
            --param-check strict --results \
            --json-out output/native/plastic-enclosure-pi/results.json \
            --save output/native/plastic-enclosure-pi/model.sc \
            --out output/native/plastic-enclosure-pi/model.step
          solidcraft-cli eval output/native/plastic-enclosure-pi/model.sc \
            --json-out output/native/plastic-enclosure-pi/measurements.json
          jq -e '
            .body_count == 1
            and .bodies[0].name == "PlasticEnclosurePi"
            and .bodies[0].closed == true
            and .bodies[0].bbox.min == [-40, -30, 0]
            and .bodies[0].bbox.max == [40, 30, 30]
            and (.sketches | length) == 2
            and (.timeline | all(.error == null))
          ' output/native/plastic-enclosure-pi/measurements.json
          unzip -p output/native/plastic-enclosure-pi/model.sc document.json \
            > output/native/plastic-enclosure-pi/document.json
          jq -e '
            [.features[].type] ==
              ["sketch", "extrude", "fillet", "shell",
               "sketch", "extrude", "boss", "boss", "boss", "boss"]
          ' output/native/plastic-enclosure-pi/document.json
          cat > output/native/plastic-enclosure-pi/change-width.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{"name":"width","expression":"100 mm"}}
          ]}
          JSON
          solidcraft-cli run output/native/plastic-enclosure-pi/change-width.json \
            --in output/native/plastic-enclosure-pi/model.sc \
            --param-check strict \
            --save output/native/plastic-enclosure-pi/model-wide.sc
          solidcraft-cli eval output/native/plastic-enclosure-pi/model-wide.sc \
            --json-out output/native/plastic-enclosure-pi/measurements-wide.json
          jq -e '
            .body_count == 1
            and .bodies[0].bbox.min[0] == -50
            and .bodies[0].bbox.max[0] == 50
            and (.timeline | all(.error == null))
          ' output/native/plastic-enclosure-pi/measurements-wide.json
          solidcraft-cli snapshot output/native/plastic-enclosure-pi/model.sc \
            --out output/native/plastic-enclosure-pi/model.png \
            --no-grid --no-axes
          test -s output/native/plastic-enclosure-pi/model.png

      - name: Render CSG cube preview
        shell: bash
        continue-on-error: true
        run: |
          solidcraft-cli snapshot output/native/csg-cube/model.sc \
            --out output/native/csg-cube/model.png \
            --no-grid --no-axes
      - name: Render preview via SolidCraft CLI (CPU renderer)
        shell: bash
        continue-on-error: true
        run: |
          solidcraft-cli snapshot output/native/plate.sc \
            --out output/native/plate.png \
            --no-grid --no-axes
      - name: Record native verification provenance
        if: success()
        shell: bash
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg version "$SOLIDCRAFT_VERSION" \
            '{source_commit:$commit, workflow_run:$run, solidcraft_version:$version, verified:true}' \
            > output/native/verification.json
      - name: Retain runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-0_30_1-runtime-evidence
          path: output/native/
          if-no-files-found: warn
          retention-days: 14

      - name: Build results site with native snapshots from this run
        if: success()
        env:
          PYTHONPATH: scpf
        shell: bash
        run: |
          set -euo pipefail
          for model in plate csg-cube bracket sample-plate plastic-enclosure plastic-enclosure-pi; do
            python -m scpf "examples/$model/scpf/model.py" \
              --out "output/examples/$model/scpf/solidcraft.json"
          done
          python scripts/ci/build-results.py \
            --generated output/examples \
            --native output/native \
            --commit "$GITHUB_SHA" \
            --out output/site
          python scripts/ci/test-results.py output/site "$GITHUB_SHA"
          test -s output/site/models/bracket/native.png
          test -s output/site/models/sample-plate/native.png
          test -s output/site/models/plastic-enclosure-pi/native.png
      - name: Find PR number for native preview
        if: success() && github.event_name == 'pull_request'
        id: preview_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
      - name: Check out existing Pages without replacing the main site
        if: success() && github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-native-preview
          persist-credentials: true
      - name: Publish native-verified PR snapshot only
        if: success() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ steps.preview_pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          dest="published-native-preview/previews/pr-${PR_NUMBER}"
          mkdir -p "$dest"
          rsync -a --delete --exclude .git output/site/ "$dest/"
          git -C published-native-preview config user.name "github-actions[bot]"
          git -C published-native-preview config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C published-native-preview add -A "previews/pr-${PR_NUMBER}"
          if ! git -C published-native-preview diff --cached --quiet; then
            git -C published-native-preview commit -m "Verified CAD preview PR #${PR_NUMBER} at ${GITHUB_SHA}"
            git -C published-native-preview push origin HEAD:gh-pages
          fi
          echo "Native-verified preview: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/previews/pr-${PR_NUMBER}/" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified results website from main only
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          keep_files: true
          # Preserve previews/pr-* and the Pages history; do not recreate an orphan branch.
          commit_message: "Verified native CAD website at ${{ github.sha }}"
      - name: Publish qualified native evidence to vrf from main only
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: vrf
          publish_dir: ./output/native
          force_orphan: true
          commit_message: "Verified SolidCraft evidence from ${{ github.sha }}"
