name: SCPF Python package qualification

on:
  push:
    branches: [main]
    paths:
      - "scpf/**"
      - "examples/**"
      - "site/qualification_cases.py"
      - "site/api_coverage.py"
      - ".github/workflows/scpf.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SCPF editable as an external-style package
        run: python -m pip install -e ./scpf
      - name: Run independent API regressions without PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          mkdir -p "$GITHUB_WORKSPACE/output/qualification"
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/scpf/tests" -v 2>&1 \
            | tee "$GITHUB_WORKSPACE/output/qualification/q1-python-tests.txt"
      - name: Compile self-contained API fixtures
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          mkdir -p output/qualification
          printf "case\tcommands\tstatus\n" > output/qualification/q2-command-contract.tsv
          native_models="$(python -c 'import sys; sys.path.insert(0, "site"); from qualification_cases import QUALIFICATION_CASES; print(" ".join(case["slug"] for case in QUALIFICATION_CASES))')"
          for model in $native_models history-policy plate; do
            python -m scpf "examples/$model/scpf/model.py" --out "output/$model.json"
            python -m json.tool "output/$model.json" >/dev/null
            count="$(jq '.commands | length' "output/$model.json")"
            printf "%s\t%s\tPASS\n" "$model" "$count" >> output/qualification/q2-command-contract.tsv
          done
      - name: Install official SolidCraft 0.30.1 (checksum-verified)
        shell: bash
        env:
          SOLIDCRAFT_VERSION: "0.30.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          archive="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$base/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$base/$archive" --output "$archive"
          grep -F " $archive" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Render each tiny API example in native SolidCraft
        shell: bash
        env:
          SOLIDCRAFT_GPU: cpu
        run: |
          set -euo pipefail
          unset PYTHONPATH
          solidcraft-cli --version
          mkdir -p output/native output/qualification
          printf "case\tbuild\teval\tsnapshot\tstatus\n" > output/qualification/q3-q4-q6-native.tsv
          native_models="$(python -c 'import sys; sys.path.insert(0, "site"); from qualification_cases import QUALIFICATION_CASES; print(" ".join(case["slug"] for case in QUALIFICATION_CASES))')"
          for model in $native_models; do
            mkdir -p "output/native/$model"
            solidcraft-cli run "output/$model.json" \
              --param-check strict --results \
              --json-out "output/native/$model/results.json" \
              --save "output/native/$model/model.sc" \
              --out "output/native/$model/model.step"
            solidcraft-cli eval "output/native/$model/model.sc" \
              --json-out "output/native/$model/measurements.json"
            jq -e '(.timeline | all(.error == null))' "output/native/$model/measurements.json"
            test -s "output/native/$model/model.step"
            solidcraft-cli snapshot "output/native/$model/model.sc" \
              --out "output/native/$model/model.png" --no-grid --no-axes
            test -s "output/native/$model/model.png"
            printf "%s\tPASS\tPASS\tPASS\tPASS\n" "$model" >> output/qualification/q3-q4-q6-native.tsv
          done
          # Parametric attachment regression: edit the saved native design,
          # not the Python model. The rigid attachment must re-solve from gap.
          jq -e '
            (all(.bodies[] | select(.name | startswith("Base"));
              ((.bbox.min[0] + 20) | fabs) < 0.001 and
              ((.bbox.max[0] - 20) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Block"));
              ((.bbox.min[0] - 30) | fabs) < 0.001 and
              ((.bbox.max[0] - 50) | fabs) < 0.001))
          ' output/native/parametric-attach/measurements.json

          cat > output/native/parametric-attach/change-gap.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"gap","expression":"30 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/parametric-attach/change-gap.json \
            --in output/native/parametric-attach/model.sc \
            --param-check strict \
            --save output/native/parametric-attach/model-gap-30.sc
          solidcraft-cli eval output/native/parametric-attach/model-gap-30.sc \
            --json-out output/native/parametric-attach/measurements-gap-30.json
          jq -e '
            (all(.bodies[] | select(.name | startswith("Base"));
              ((.bbox.min[0] + 20) | fabs) < 0.001 and
              ((.bbox.max[0] - 20) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Block"));
              ((.bbox.min[0] - 50) | fabs) < 0.001 and
              ((.bbox.max[0] - 70) | fabs) < 0.001))
          ' output/native/parametric-attach/measurements-gap-30.json

          # Parametric in-plane offset regression: on FRONT_TOP_RIGHT the
          # second planar value follows the vertical corner edge. A negative
          # value moves outward/upward. Keep it as a parameter expression so
          # editing the saved design re-solves the joint.
          jq -e '
            (all(.bodies[] | select(.name | startswith("Marker"));
              ((.bbox.min[0] - 10) | fabs) < 0.001 and
              ((.bbox.max[0] - 20) | fabs) < 0.001 and
              ((.bbox.min[2] - 25) | fabs) < 0.001 and
              ((.bbox.max[2] - 35) | fabs) < 0.001))
          ' output/native/parametric-offset/measurements.json

          cat > output/native/parametric-offset/change-shift.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"shift","expression":"10 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/parametric-offset/change-shift.json \
            --in output/native/parametric-offset/model.sc \
            --param-check strict \
            --save output/native/parametric-offset/model-shift-10.sc
          solidcraft-cli eval output/native/parametric-offset/model-shift-10.sc \
            --json-out output/native/parametric-offset/measurements-shift-10.json
          jq -e '
            (all(.bodies[] | select(.name | startswith("Marker"));
              ((.bbox.min[0] - 10) | fabs) < 0.001 and
              ((.bbox.max[0] - 20) | fabs) < 0.001 and
              ((.bbox.min[2] - 30) | fabs) < 0.001 and
              ((.bbox.max[2] - 40) | fabs) < 0.001))
          ' output/native/parametric-offset/measurements-shift-10.json

          # Parametric face-anchor regression: the attach reference itself
          # must follow the parent's RIGHT face when its width changes.
          jq -e '
            (all(.bodies[] | select(.name | startswith("Base"));
              ((.bbox.min[0] + 20) | fabs) < 0.001 and
              ((.bbox.max[0] - 20) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Block"));
              ((.bbox.min[0] - 20) | fabs) < 0.001 and
              ((.bbox.max[0] - 40) | fabs) < 0.001))
          ' output/native/parametric-anchor/measurements.json

          cat > output/native/parametric-anchor/change-base-width.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"base_width","expression":"80 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/parametric-anchor/change-base-width.json \
            --in output/native/parametric-anchor/model.sc \
            --param-check strict \
            --save output/native/parametric-anchor/model-width-80.sc
          solidcraft-cli eval output/native/parametric-anchor/model-width-80.sc \
            --json-out output/native/parametric-anchor/measurements-width-80.json
          jq -e '
            (all(.bodies[] | select(.name | startswith("Base"));
              ((.bbox.min[0] + 40) | fabs) < 0.001 and
              ((.bbox.max[0] - 40) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Block"));
              ((.bbox.min[0] - 40) | fabs) < 0.001 and
              ((.bbox.max[0] - 60) | fabs) < 0.001))
          ' output/native/parametric-anchor/measurements-width-80.json

          # Native corner-anchor regression: the marker is attached to the
          # Base's FRONT_TOP_RIGHT corner. Changing both width and height in
          # the saved design must move that corner, and the marker with it.
          jq -e '
            (all(.bodies[] | select(.name | startswith("Base"));
              ((.bbox.min[0] + 20) | fabs) < 0.001 and
              ((.bbox.max[0] - 20) | fabs) < 0.001 and
              ((.bbox.min[2] - 0) | fabs) < 0.001 and
              ((.bbox.max[2] - 20) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Marker"));
              ((.bbox.min[0] - 10) | fabs) < 0.001 and
              ((.bbox.max[0] - 20) | fabs) < 0.001 and
              ((.bbox.min[2] - 20) | fabs) < 0.001 and
              ((.bbox.max[2] - 30) | fabs) < 0.001))
          ' output/native/corner-anchor/measurements.json

          cat > output/native/corner-anchor/change-size.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"base_width","expression":"80 mm"
            }},
            {"command":"parameters.change","params":{
              "name":"base_height","expression":"40 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/corner-anchor/change-size.json \
            --in output/native/corner-anchor/model.sc \
            --param-check strict \
            --save output/native/corner-anchor/model-size-80x40.sc
          solidcraft-cli eval output/native/corner-anchor/model-size-80x40.sc \
            --json-out output/native/corner-anchor/measurements-size-80x40.json
          jq -e '
            (all(.bodies[] | select(.name | startswith("Base"));
              ((.bbox.min[0] + 40) | fabs) < 0.001 and
              ((.bbox.max[0] - 40) | fabs) < 0.001 and
              ((.bbox.min[2] - 0) | fabs) < 0.001 and
              ((.bbox.max[2] - 40) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Marker"));
              ((.bbox.min[0] - 30) | fabs) < 0.001 and
              ((.bbox.max[0] - 40) | fabs) < 0.001 and
              ((.bbox.min[2] - 40) | fabs) < 0.001 and
              ((.bbox.max[2] - 50) | fabs) < 0.001))
          ' output/native/corner-anchor/measurements-size-80x40.json

          # Custom component-anchor regression: Arm:1.tip is authored while
          # the occurrence is at identity, then the Arm rotates 90 degrees
          # about Z. The named SolidCraft joint origin must rotate with it and
          # place Marker at the rotated tip (0, 20, 5).
          jq -e '
            (all(.bodies[] | select(.name | startswith("Arm"));
              ((.bbox.min[0] + 5) | fabs) < 0.001 and
              ((.bbox.max[0] - 5) | fabs) < 0.001 and
              ((.bbox.min[1] + 20) | fabs) < 0.001 and
              ((.bbox.max[1] - 20) | fabs) < 0.001)) and
            (all(.bodies[] | select(.name | startswith("Marker"));
              ((.bbox.min[0] + 5) | fabs) < 0.001 and
              ((.bbox.max[0] - 5) | fabs) < 0.001 and
              ((.bbox.min[1] - 15) | fabs) < 0.001 and
              ((.bbox.max[1] - 25) | fabs) < 0.001 and
              ((.bbox.min[2] - 0) | fabs) < 0.001 and
              ((.bbox.max[2] - 10) | fabs) < 0.001))
          ' output/native/custom-anchor/measurements.json

          # XZ rectangular component regression: markers are attached to
          # both FRONT_TOP corners. Their local frames are mirrored, so check
          # each side separately before changing the saved design.
          jq -e '
            (all(.bodies[] | select(.name | startswith("Board"));
              ((.bbox.min[0] + 20) | fabs) < 0.001 and
              ((.bbox.max[0] - 20) | fabs) < 0.001 and
              ((.bbox.min[2] - 0) | fabs) < 0.001 and
              ((.bbox.max[2] - 20) | fabs) < 0.001)) and
            ([.bodies[] | select(.name | startswith("Marker"))] | length) == 2 and
            ([.bodies[] | select((.name | startswith("Marker"))
              and .bbox.min[0] > 0
              and ((.bbox.min[0] - 10) | fabs) < 0.001
              and ((.bbox.max[0] - 20) | fabs) < 0.001
              and ((.bbox.min[2] - 20) | fabs) < 0.001
              and ((.bbox.max[2] - 30) | fabs) < 0.001)] | length) == 1 and
            ([.bodies[] | select((.name | startswith("Marker"))
              and .bbox.max[0] < 0
              and ((.bbox.min[0] + 30) | fabs) < 0.001
              and ((.bbox.max[0] + 20) | fabs) < 0.001
              and ((.bbox.min[2] - 10) | fabs) < 0.001
              and ((.bbox.max[2] - 20) | fabs) < 0.001)] | length) == 1
          ' output/native/xz-anchor/measurements.json

          cat > output/native/xz-anchor/change-size.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"board_width","expression":"80 mm"
            }},
            {"command":"parameters.change","params":{
              "name":"board_height","expression":"40 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/xz-anchor/change-size.json \
            --in output/native/xz-anchor/model.sc \
            --param-check strict \
            --save output/native/xz-anchor/model-size-80x40.sc
          solidcraft-cli eval output/native/xz-anchor/model-size-80x40.sc \
            --json-out output/native/xz-anchor/measurements-size-80x40.json
          jq -e '
            (all(.bodies[] | select(.name | startswith("Board"));
              ((.bbox.min[0] + 40) | fabs) < 0.001 and
              ((.bbox.max[0] - 40) | fabs) < 0.001 and
              ((.bbox.min[2] - 0) | fabs) < 0.001 and
              ((.bbox.max[2] - 40) | fabs) < 0.001)) and
            ([.bodies[] | select(.name | startswith("Marker"))] | length) == 2 and
            ([.bodies[] | select((.name | startswith("Marker"))
              and .bbox.min[0] > 0
              and ((.bbox.min[0] - 30) | fabs) < 0.001
              and ((.bbox.max[0] - 40) | fabs) < 0.001
              and ((.bbox.min[2] - 40) | fabs) < 0.001
              and ((.bbox.max[2] - 50) | fabs) < 0.001)] | length) == 1 and
            ([.bodies[] | select((.name | startswith("Marker"))
              and .bbox.max[0] < 0
              and ((.bbox.min[0] + 50) | fabs) < 0.001
              and ((.bbox.max[0] + 40) | fabs) < 0.001
              and ((.bbox.min[2] - 30) | fabs) < 0.001
              and ((.bbox.max[2] - 40) | fabs) < 0.001)] | length) == 1
          ' output/native/xz-anchor/measurements-size-80x40.json

          printf "case\tmutation\tstatus\n" > output/qualification/q5-parametric-mutation.tsv
          printf "parametric-attach\tgap 10 -> 30 mm\tPASS\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "parametric-offset\tshift 5 -> 10 mm\tPASS\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "parametric-anchor\tbase_width 40 -> 80 mm\tPASS\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "corner-anchor\tbase 40x20 -> 80x40 mm\tPASS\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "xz-anchor\tboard 40x20 -> 80x40 mm\tPASS\n" >> output/qualification/q5-parametric-mutation.tsv

          jq -n --arg source "$GITHUB_SHA" \
            '{source_commit:$source,solidcraft_version:"0.30.1",verified:true,
              levels:{q1:"python-api",q2:"command-contract",q3:"native-build",
                      q4:"native-measurement",q5:"parametric-mutation",
                      q6:"native-snapshot"}}' \
            > output/native/verification.json
      - name: Build qualification report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p output/qualification
          report="output/qualification/REPORT.md"
          {
            echo "# SCPF Forge qualification"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Target SolidCraft: 0.30.1"
            echo
            echo "## Q1 — Python API regressions"
            echo
            if test -s output/qualification/q1-python-tests.txt; then
              echo '~~~text'
              tail -n 40 output/qualification/q1-python-tests.txt
              echo '~~~'
            else
              echo "No Q1 result file was produced."
            fi
            echo
            echo "## Q2 — command contract"
            echo
            if test -s output/qualification/q2-command-contract.tsv; then
              echo '~~~text'
              cat output/qualification/q2-command-contract.tsv
              echo '~~~'
            else
              echo "No Q2 result file was produced."
            fi
            echo
            echo "## Q3/Q4/Q6 — native build, measurement and snapshot"
            echo
            if test -s output/qualification/q3-q4-q6-native.tsv; then
              echo '~~~text'
              cat output/qualification/q3-q4-q6-native.tsv
              echo '~~~'
            else
              echo "No native result table was produced."
            fi
            echo
            echo "## Q5 — saved-design parameter mutation"
            echo
            if test -s output/qualification/q5-parametric-mutation.tsv; then
              echo '~~~text'
              cat output/qualification/q5-parametric-mutation.tsv
              echo '~~~'
            else
              echo "No Q5 result table was produced."
            fi
            echo
            echo "## Evidence retained"
            echo
            echo "- generated command JSON"
            echo "- native SolidCraft results and timeline evaluation"
            echo "- saved .sc designs"
            echo "- STEP exports"
            echo "- measurement JSON"
            echo "- native PNG snapshots"
            echo
            echo "See scpf/docs/architecture.md for the required per-case sheet:"
            echo "Intent -> Forge API -> Forge model -> SolidCraft lowering -> native expectation -> mutation -> evidence -> reference model."
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpf-qualification-${{ github.sha }}
          path: |
            output/qualification
            output/*.json
            output/native
          if-no-files-found: warn
          retention-days: 30

      - name: Build the lightweight library Pages site
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python site/build.py --out output/site --source-sha "$GITHUB_SHA" --native output/native
          python site/test_site.py output/site "$GITHUB_SHA" --require-native
      - name: Upload library site preview
        uses: actions/upload-artifact@v4
        with:
          name: scpf-library-site
          path: output/site
          if-no-files-found: error
      - name: Publish clean library site (after passing regression tests)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          keep_files: false
          commit_message: "Verified SCPF library site at ${{ github.sha }}"
