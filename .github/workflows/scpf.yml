name: SCPF Python package qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "scpf/**"
      - "examples/**"
      - "site/**"
      - "README.md"
      - ".github/workflows/scpf.yml"
  push:
    branches: [main]
    paths:
      - "scpf/**"
      - "examples/**"
      - "site/**"
      - "README.md"
      - ".github/workflows/scpf.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SCPF editable as an external-style package
        run: python -m pip install -e ./scpf
      - name: Run independent API regressions without PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m unittest discover -s scpf/tests -v
      - name: Compile self-contained API fixtures
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          for model in simple-box anchored-holes components history-policy plate bracket; do
            python -m scpf "examples/$model/scpf/model.py" --out "output/$model.json"
            python -m json.tool "output/$model.json" >/dev/null
          done
      - name: Build the lightweight library Pages site
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python site/build.py --out output/site --source-sha "$GITHUB_SHA"
          python site/test_site.py output/site "$GITHUB_SHA"
      - name: Upload library site preview
        uses: actions/upload-artifact@v4
        with:
          name: scpf-library-site
          path: output/site
          if-no-files-found: error
      - name: Publish clean library site (after passing regression tests)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          keep_files: false
          commit_message: "Verified SCPF library site at ${{ github.sha }}"
