name: SCPF Python package qualification

on:
  push:
    branches:
      - main
      - "qualify/**"
      - "qualification/**"
      - "fix/**"
    paths:
      - "scpf/**"
      - "examples/**"
      - "qualification/**"
      - "site/api_coverage.py"
      - ".github/workflows/scpf.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scpf-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      SOLIDCRAFT_VERSION: "0.30.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SCPF editable as an external-style package
        run: python -m pip install -e ./scpf pillow

      - name: Restore rendered CADCraft diagrams
        id: cadcraft_diagrams
        uses: actions/cache@v4
        with:
          path: output/diagrams
          key: cadcraft-diagrams-v0.20.1-${{ hashFiles('qualification/diagrams/*.cadcraft.json', 'qualification/render_cadcraft_diagram.sh') }}

      - name: Cache CADCraft CLI
        if: steps.cadcraft_diagrams.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/cadcraft/0.20.1-linux-x86_64
          key: cadcraft-0.20.1-linux-x86_64

      - name: Set up CADCraft CLI
        if: steps.cadcraft_diagrams.outputs.cache-hit != 'true'
        shell: bash
        run: bash qualification/setup_cadcraft.sh

      - name: Render technical qualification diagrams
        if: steps.cadcraft_diagrams.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/diagrams
          for plan in qualification/diagrams/*.cadcraft.json; do
            bash qualification/render_cadcraft_diagram.sh "$plan" output/diagrams
          done
      - name: Run independent API regressions without PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          mkdir -p "$GITHUB_WORKSPACE/output/qualification"
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/scpf/tests" -v 2>&1 \
            | tee "$GITHUB_WORKSPACE/output/qualification/q1-python-tests.txt"
      - name: Run standard qualification tests (command contract)
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          mkdir -p "$GITHUB_WORKSPACE/output/qualification"
          cd "$RUNNER_TEMP"
          python -m unittest discover \
            -s "$GITHUB_WORKSPACE/qualification/tests" -v 2>&1 \
            | tee "$GITHUB_WORKSPACE/output/qualification/q2-python-qualification-tests.txt"
      - name: Compile self-contained API fixtures
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          mkdir -p output/qualification
          printf "case\tcommands\tstatus\n" > output/qualification/q2-command-contract.tsv
          native_models="$(python -c 'from qualification.cases import QUALIFICATION_CASES; print(" ".join(case["slug"] for case in QUALIFICATION_CASES))')"
          for model in $native_models history-policy plate; do
            python -m scpf "examples/$model/scpf/model.py" --out "output/$model.json"
            python -m json.tool "output/$model.json" >/dev/null
            count="$(jq '.commands | length' "output/$model.json")"
            printf "%s\t%s\tPASS\n" "$model" "$count" >> output/qualification/q2-command-contract.tsv
          done
      - name: Install official SolidCraft 0.30.1 (checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          archive="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$base/SHA256SUMS.txt" --output SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$base/$archive" --output "$archive"
          grep -F " $archive" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Render each tiny API example in native SolidCraft
        shell: bash
        env:
          SOLIDCRAFT_GPU: cpu
        run: |
          set -euo pipefail
          unset PYTHONPATH
          solidcraft-cli --version
          mkdir -p output/native output/qualification
          printf "case\tbuild\teval\tsnapshot\tstatus\n" > output/qualification/q3-q4-q6-native.tsv
          native_models="$(python -c 'from qualification.cases import QUALIFICATION_CASES; print(" ".join(case["slug"] for case in QUALIFICATION_CASES))')"
          for model in $native_models; do
            mkdir -p "output/native/$model"
            solidcraft-cli run "output/$model.json" \
              --param-check strict --results \
              --json-out "output/native/$model/results.json" \
              --save "output/native/$model/model.sc" \
              --out "output/native/$model/model.step"
            solidcraft-cli eval "output/native/$model/model.sc" \
              --json-out "output/native/$model/measurements.json"
            jq -e '(.timeline | all(.error == null))' "output/native/$model/measurements.json"
            solidcraft-cli run qualification/commands/inspect-joints.json \
              --in "output/native/$model/model.sc" \
              --param-check strict --results \
              --json-out "output/native/$model/joint-inspect.json"
            test -s "output/native/$model/model.step"
            solidcraft-cli snapshot "output/native/$model/model.sc" \
              --out "output/native/$model/model.png" --no-grid --no-axes
            test -s "output/native/$model/model.png"

            for view in front right iso; do
              camera="$(python qualification/camera.py \
                "output/native/$model/measurements.json" "$view")"
              printf '%s\n' "$camera" > "output/native/$model/camera-$view.json"
              solidcraft-cli snapshot "output/native/$model/model.sc" \
                --out "output/native/$model/model-$view.png" \
                --width 720 --height 540 --camera "$camera" --no-grid --no-axes
              test -s "output/native/$model/model-$view.png"
              python qualification/goal_overlay.py \
                --case "$model" \
                --camera "output/native/$model/camera-$view.json" \
                --actual "output/native/$model/model-$view.png" \
                --goal "output/native/$model/goal-$view.png" \
                --overlay "output/native/$model/overlay-$view.png"
            done

            printf "%s\tPASS\tPASS\tPASS\tPASS\n" "$model" >> output/qualification/q3-q4-q6-native.tsv
          done
          # Four-corner diagnostic evidence. The functional assertions are
          # standard unittest cases in qualification/tests.
          solidcraft-cli run qualification/commands/four-corner-l/inspect-joints.json \
            --in output/native/four-corner-l/model.sc \
            --param-check strict --results \
            --json-out output/native/four-corner-l/joint-inspect.json

          # Named group hierarchy: ask native SolidCraft to report both the
          # direct root children and the flattened subassembly contents.
          solidcraft-cli run qualification/commands/group-hierarchy/inspect-bom.json \
            --in output/native/group-hierarchy/model.sc \
            --param-check strict --results \
            --json-out output/native/group-hierarchy/results-bom.json

          # Assembly-owned semantic anchor: native corner relationship must remain associative.
          solidcraft-cli run qualification/commands/assembly-owned-anchor/change-size.json \
            --in output/native/assembly-owned-anchor/model.sc \
            --param-check strict \
            --save output/native/assembly-owned-anchor/model-size-80x40.sc

          solidcraft-cli eval output/native/assembly-owned-anchor/model-size-80x40.sc \
            --json-out output/native/assembly-owned-anchor/measurements-size-80x40.json

          # Explicit AnchorTopology: fixed initial pick must follow resized topology.
          solidcraft-cli run qualification/commands/anchor-topology-mutation/change-size.json \
            --in output/native/anchor-topology-mutation/model.sc \
            --param-check strict \
            --save output/native/anchor-topology-mutation/model-size-80x40.sc

          solidcraft-cli eval output/native/anchor-topology-mutation/model-size-80x40.sc \
            --json-out output/native/anchor-topology-mutation/measurements-size-80x40.json

          # Saved-design width/depth mutation. Python is not rerun here.
          solidcraft-cli run qualification/commands/four-corner-l/change-size.json \
            --in output/native/four-corner-l/model.sc \
            --param-check strict \
            --save output/native/four-corner-l/model-size-160x120.sc

          solidcraft-cli eval output/native/four-corner-l/model-size-160x120.sc \
            --json-out output/native/four-corner-l/measurements-size-160x120.json

          solidcraft-cli snapshot output/native/four-corner-l/model-size-160x120.sc \
            --out output/native/four-corner-l/model-size-160x120.png --no-grid --no-axes
          test -s output/native/four-corner-l/model-size-160x120.png
          for view in front right iso; do
            camera="$(python qualification/camera.py \
              output/native/four-corner-l/measurements-size-160x120.json "$view")"
            printf '%s\n' "$camera" > "output/native/four-corner-l/camera-size-160x120-$view.json"
            solidcraft-cli snapshot output/native/four-corner-l/model-size-160x120.sc \
              --out "output/native/four-corner-l/model-size-160x120-$view.png" \
              --width 720 --height 540 --camera "$camera" --no-grid --no-axes
            test -s "output/native/four-corner-l/model-size-160x120-$view.png"
          done

          solidcraft-cli run qualification/commands/four-corner-l/inspect-joints.json \
            --in output/native/four-corner-l/model-size-160x120.sc \
            --param-check strict --results \
            --json-out output/native/four-corner-l/joint-inspect-size-160x120.json

          # Parent-derived child dimensions: mutate only parent parameters.
          solidcraft-cli run qualification/commands/parent-derived-child-size/change-size.json \
            --in output/native/parent-derived-child-size/model.sc \
            --param-check strict \
            --save output/native/parent-derived-child-size/model-size-160x120.sc

          solidcraft-cli eval output/native/parent-derived-child-size/model-size-160x120.sc \
            --json-out output/native/parent-derived-child-size/measurements-size-160x120.json

          # Eight 3D flightcase corners: verify all topology corners follow resize.
          solidcraft-cli run qualification/commands/eight-flightcase-corners/change-size.json \
            --in output/native/eight-flightcase-corners/model.sc \
            --param-check strict \
            --save output/native/eight-flightcase-corners/model-size-160x120x90.sc

          solidcraft-cli eval output/native/eight-flightcase-corners/model-size-160x120x90.sc \
            --json-out output/native/eight-flightcase-corners/measurements-size-160x120x90.json

          # Eight outside brackets: saved-design width/depth/height mutation.
          solidcraft-cli run qualification/commands/eight-corner-brackets/change-size.json \
            --in output/native/eight-corner-brackets/model.sc \
            --param-check strict \
            --save output/native/eight-corner-brackets/model-size-160x120x90.sc

          solidcraft-cli eval output/native/eight-corner-brackets/model-size-160x120x90.sc \
            --json-out output/native/eight-corner-brackets/measurements-size-160x120x90.json

          # Parameter-scope native evidence and saved-design mutation.
          solidcraft-cli run output/parameter-scope.json \
            --param-check strict \
            --save output/native/parameter-scope/model.json

          solidcraft-cli run qualification/commands/parameter-scope/export-parameters.json \
            --in output/native/parameter-scope/model.sc \
            --param-check strict \
            --json-out output/native/parameter-scope/parameters-export-results.json

          solidcraft-cli run qualification/commands/parameter-scope/change-shared-width.json \
            --in output/native/parameter-scope/model.sc \
            --param-check strict \
            --save output/native/parameter-scope/model-shared-width-100.sc

          solidcraft-cli eval output/native/parameter-scope/model-shared-width-100.sc \
            --json-out output/native/parameter-scope/measurements-shared-width-100.json

          # Produce saved-design mutation evidence. Geometry correctness is
          # evaluated centrally by qualification/native_validation.py.

          cat > output/native/parametric-attach/change-gap.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"gap","expression":"30 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/parametric-attach/change-gap.json \
            --in output/native/parametric-attach/model.sc \
            --param-check strict \
            --save output/native/parametric-attach/model-gap-30.sc
          solidcraft-cli eval output/native/parametric-attach/model-gap-30.sc \
            --json-out output/native/parametric-attach/measurements-gap-30.json

          cat > output/native/parametric-offset/change-shift.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"shift","expression":"10 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/parametric-offset/change-shift.json \
            --in output/native/parametric-offset/model.sc \
            --param-check strict \
            --save output/native/parametric-offset/model-shift-10.sc
          solidcraft-cli eval output/native/parametric-offset/model-shift-10.sc \
            --json-out output/native/parametric-offset/measurements-shift-10.json

          cat > output/native/parametric-anchor/change-base-width.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"base_width","expression":"80 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/parametric-anchor/change-base-width.json \
            --in output/native/parametric-anchor/model.sc \
            --param-check strict \
            --save output/native/parametric-anchor/model-width-80.sc
          solidcraft-cli eval output/native/parametric-anchor/model-width-80.sc \
            --json-out output/native/parametric-anchor/measurements-width-80.json

          cat > output/native/corner-anchor/change-size.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"base_width","expression":"80 mm"
            }},
            {"command":"parameters.change","params":{
              "name":"base_height","expression":"40 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/corner-anchor/change-size.json \
            --in output/native/corner-anchor/model.sc \
            --param-check strict \
            --save output/native/corner-anchor/model-size-80x40.sc
          solidcraft-cli eval output/native/corner-anchor/model-size-80x40.sc \
            --json-out output/native/corner-anchor/measurements-size-80x40.json

          cat > output/native/xz-anchor/change-size.json <<'JSON'
          {"commands":[
            {"command":"parameters.change","params":{
              "name":"board_width","expression":"80 mm"
            }},
            {"command":"parameters.change","params":{
              "name":"board_height","expression":"40 mm"
            }}
          ]}
          JSON
          solidcraft-cli run output/native/xz-anchor/change-size.json \
            --in output/native/xz-anchor/model.sc \
            --param-check strict \
            --save output/native/xz-anchor/model-size-80x40.sc
          solidcraft-cli eval output/native/xz-anchor/model-size-80x40.sc \
            --json-out output/native/xz-anchor/measurements-size-80x40.json

          printf "case\tmutation\tstatus\n" > output/qualification/q5-parametric-mutation.tsv
          printf "parameter-scope\tshared_width 80 -> 100 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "parent-derived-child-size\tparent 120x80 -> 160x120 mm; child follows 60x40 -> 80x60 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "assembly-owned-anchor\tbase 40x20 -> 80x40 mm; named semantic anchor follows corner\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "anchor-topology-mutation\tboard 40x20 -> 80x40 mm; fixed topology pick follows corner\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "four-corner-l\tframe footprint 120x80 -> 160x120 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "eight-flightcase-corners\tcase 120x80x60 -> 160x120x90 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "eight-corner-brackets\tframe 120x80x60 -> 160x120x90 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "parametric-attach\tgap 10 -> 30 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "parametric-offset\tshift 5 -> 10 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "parametric-anchor\tbase_width 40 -> 80 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "corner-anchor\tbase 40x20 -> 80x40 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv
          printf "xz-anchor\tboard 40x20 -> 80x40 mm\tPRODUCED\n" >> output/qualification/q5-parametric-mutation.tsv

          python qualification/native_validation.py \
            --native-root output/native \
            --qualification-dir output/qualification

          python qualification/visual_validation.py \
            --native-root output/native \
            --qualification-dir output/qualification

          jq -n --arg source "$GITHUB_SHA" --arg version "$SOLIDCRAFT_VERSION" \
            '{source_commit:$source,solidcraft_version:$version,verified:true,
              levels:{q1:"python-api",q2:"command-contract",q3:"native-build",
                      q4:"native-semantic-validation",q5:"parametric-mutation",
                      q6:"visual-regression"}}' \
            > output/native/verification.json
      - name: Collect structured qualification results
        shell: bash
        run: |
          set -euo pipefail
          python qualification/results.py \
            --qualification-dir output/qualification \
            --native-root output/native \
            --source-sha "$GITHUB_SHA" \
            --solidcraft-version "$SOLIDCRAFT_VERSION"

      - name: Build qualification report
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if test -s output/qualification/results.json; then
            python qualification/report.py \
              --results output/qualification/results.json \
              --out output/qualification/REPORT.md
            cat output/qualification/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Structured qualification results were not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpf-qualification-${{ github.sha }}
          path: |
            output/qualification
            output/*.json
            output/native
          if-no-files-found: warn
          retention-days: 30

      - name: Build the lightweight library Pages site
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python site/build.py --out output/site --source-sha "$GITHUB_SHA" --native output/native --diagram-root output/diagrams
          python site/test_site.py output/site "$GITHUB_SHA" --require-native
      - name: Upload library site preview
        uses: actions/upload-artifact@v4
        with:
          name: scpf-library-site
          path: output/site
          if-no-files-found: error
      - name: Resolve native PR preview target
        id: native_preview
        if: success() && startsWith(github.ref_name, 'qualify/pr-')
        shell: bash
        run: |
          pr="${GITHUB_REF_NAME#qualify/pr-}"
          echo "destination=previews/pr-$pr" >> "$GITHUB_OUTPUT"

      - name: Publish native qualification to PR preview
        if: steps.native_preview.outputs.destination != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          destination_dir: ${{ steps.native_preview.outputs.destination }}
          keep_files: true
          commit_message: "Native qualification ${{ github.ref_name }} at ${{ github.sha }}"

      - name: Publish current library site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output/site
          keep_files: true
          commit_message: "SCPF library site at ${{ github.sha }}"

      - name: Qualification status (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(
              Path("output/qualification/results.json").read_text(encoding="utf-8")
          )
          failing = {
              slug: case["status"]
              for slug, case in results["cases"].items()
              if case["status"] != "pass"
          }
          if failing:
              for slug, status in failing.items():
                  print(f"{slug}: {status.upper()}")
              raise SystemExit(
                  f"Qualification failed: {len(failing)} case(s) are not PASS"
              )
          print(f"Qualification passed: {len(results['cases'])} case(s)")
          PY

