name: SCPF Python model qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scpf/**"
      - "examples/**/scpf/**"
      - "examples/**/scpf/reference.json"
      - "scripts/ci/build-results.py"
      - "scripts/ci/test-results.py"
      - "site/**"
      - ".github/workflows/scpf.yml"
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: scpf-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Python CAD models against reviewed command fixtures
        env:
          PYTHONPATH: scpf
        run: python -m unittest discover -s scpf/tests -v
      - name: Generate SCPF example command plans
        env:
          PYTHONPATH: scpf
        run: |
          python -m scpf examples/plate/scpf/model.py --out output/examples/plate/scpf/solidcraft.json
          python -m scpf examples/csg-cube/scpf/model.py --out output/examples/csg-cube/scpf/solidcraft.json
          python -m scpf examples/bracket/scpf/model.py --out output/examples/bracket/scpf/solidcraft.json
          python -m scpf examples/sample-plate/scpf/model.py --out output/examples/sample-plate/scpf/solidcraft.json
      - name: Validate and compare command documents
        shell: bash
        run: |
          set -euo pipefail
          for model in plate csg-cube; do
            jq empty "output/examples/$model/scpf/solidcraft.json"
            jq -e -s '.[0] == .[1]' \
              "examples/$model/scrf/solidcraft.json" \
              "output/examples/$model/scpf/solidcraft.json" >/dev/null
          done
          jq empty output/examples/bracket/scpf/solidcraft.json
          jq -e -s '.[0] == .[1]' \
            examples/bracket/scpf/solidcraft.json \
            output/examples/bracket/scpf/solidcraft.json >/dev/null
      - name: Retain generated SCPF commands
        uses: actions/upload-artifact@v4
        with:
          name: scpf-native-command-plans
          path: output/examples/*/scpf/solidcraft.json
          if-no-files-found: error

      - name: Record SCPF build provenance
        if: success()
        shell: bash
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{source_commit:$sha, workflow_run:$run, implementation:"scpf-python", models:["plate","csg-cube","bracket","sample-plate"]}' \
            > output/examples/scpf-build.json
      - name: Build and smoke-test results pages without publishing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/build-results.py \
            --generated output/examples \
            --commit "$GITHUB_SHA" \
            --out output/site
          python scripts/ci/test-results.py output/site "$GITHUB_SHA"
      - name: Retain fast website preview (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: scpf-site-preview
          path: output/site/
          retention-days: 7
          if-no-files-found: error
