name: SCPF Python package qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "scpf/**"
      - "examples/**"
      - ".github/workflows/scpf.yml"
  push:
    branches: [main]
    paths:
      - "scpf/**"
      - "examples/**"
      - ".github/workflows/scpf.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SCPF editable as an external-style package
        run: python -m pip install -e ./scpf
      - name: Run independent API regressions without PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python -m unittest discover -s scpf/tests -v
      - name: Compile self-contained API fixtures
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH
          for model in anchored-holes components history-policy plate bracket; do
            python -m scpf "examples/$model/scpf/model.py" --out "output/$model.json"
            python -m json.tool "output/$model.json" >/dev/null
          done
