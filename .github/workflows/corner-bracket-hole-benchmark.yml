name: CornerBracket hole Boolean benchmark (0.30.1)

on:
  push:
    branches: [example/corner-bracket]
    paths: [.github/workflows/corner-bracket-hole-benchmark.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLIDCRAFT_VERSION: "0.30.1"
      SOLIDCRAFT_GPU: cpu
      PYTHONPATH: scpf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch verified official SolidCraft CLI
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          BASE="https://github.com/tangency-labs/solidcraft/releases/download/v${SOLIDCRAFT_VERSION}"
          ARCHIVE="solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error "$BASE/SHA256SUMS.txt" -o SHA256SUMS.txt
          curl --fail --location --retry 3 --silent --show-error "$BASE/$ARCHIVE" -o "$ARCHIVE"
          grep -F " $ARCHIVE" SHA256SUMS.txt | sha256sum --check
          tar -xzf "$ARCHIVE"
          echo "$RUNNER_TEMP/solidcraft-${SOLIDCRAFT_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Reproduce and measure each hole operation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/bench
          python -m scpf examples/corner-bracket/scpf/model.py --out output/bench/full.json
          python - <<'PY'
          import json, subprocess, time
          from pathlib import Path

          out = Path("output/bench")
          cmds = json.loads((out / "full.json").read_text())["commands"]
          assert cmds[26]["command"] == "solid.hole"
          assert cmds[27]["params"]["type"] == "countersink"
          basic = dict(cmds[27])
          basic["params"] = {k: v for k, v in cmds[27]["params"].items()
                             if k not in ("type", "cs_diameter", "cs_angle")}
          at_top = dict(cmds[27])
          at_top["params"] = {**cmds[27]["params"], "position": cmds[26]["params"]["position"]}
          plain_top = dict(at_top)
          plain_top["params"] = {k: v for k, v in at_top["params"].items()
                                 if k not in ("type", "cs_diameter", "cs_angle")}
          single_cb = dict(at_top)
          single_cb["params"] = {**basic["params"], "position": cmds[26]["params"]["position"],
                                 "type": "counterbore",
                                 "cb_diameter": cmds[26]["params"]["diameter"],
                                 "cb_depth": cmds[26]["params"]["depth"]}
          variants = {
              "00-before-hole": cmds[:26],
              "01-head-recess": cmds[:27],
              "02-recess-then-countersink": cmds[:28],
              "03-recess-then-plain-bore": cmds[:27] + [basic],
              "04-single-countersink": cmds[:26] + [at_top],
              "05-single-plain-bore": cmds[:26] + [plain_top],
              "06-one-counterbore": cmds[:26] + [single_cb],
          }
          results = []
          for name, commands in variants.items():
              src = out / f"{name}.json"
              src.write_text(json.dumps({"commands": commands}, indent=2))
              started = time.perf_counter()
              args = ["solidcraft-cli", "run", str(src), "--param-check", "strict",
                      "--save", str(out / f"{name}.sc")]
              try:
                  r = subprocess.run(args, capture_output=True, text=True, timeout=90)
                  duration = round(time.perf_counter() - started, 2)
                  output = r.stdout + "\n" + r.stderr
                  status = "PASS" if r.returncode == 0 else f"EXIT {r.returncode}"
              except subprocess.TimeoutExpired as exc:
                  duration = round(time.perf_counter() - started, 2)
                  status = "TIMEOUT"
                  output = str(exc)
              item = {"case": name, "seconds": duration, "status": status,
                      "messages": [x for x in output.splitlines() if
                                   "warning" in x.lower() or "error" in x.lower()][-8:]}
              results.append(item)
              print(f"BENCHMARK {name}: {duration:.2f}s {status}", flush=True)
              for msg in item["messages"]:
                  print("  " + msg[:300], flush=True)
          (out / "timings.json").write_text(json.dumps(results, indent=2))
          failures = [x["case"] for x in results if x["status"] != "PASS"]
          if failures:
              print("Investigate these cases:", failures)
          PY
      - name: Store benchmark inputs and timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corner-bracket-hole-benchmark
          path: output/bench/
          retention-days: 14
