[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scpf"
version = "0.1.0"
description = "Python scripting interface for the SolidCraft CAD engine"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["scpf*"]
