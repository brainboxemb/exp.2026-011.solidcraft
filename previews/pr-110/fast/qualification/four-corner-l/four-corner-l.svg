<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">External L-bracket four-corner qualification setup</title>
  <desc id="desc">Front view of a rectangular frame with four external L brackets. Parent anchors are labelled at all four front corners. The top-left bracket also shows the child mount anchor and local X and Z directions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f5fae"/>
    </marker>
    <style>
      .title{font:700 28px system-ui,sans-serif;fill:#13233a}
      .label{font:600 17px system-ui,sans-serif;fill:#13233a}
      .small{font:14px system-ui,sans-serif;fill:#4d6078}
      .frame{fill:#e9eef5;stroke:#53657a;stroke-width:4}
      .bracket{fill:#aeb8c5;stroke:#46586c;stroke-width:3}
      .anchor{fill:#fff;stroke:#0b63ce;stroke-width:4}
      .mount{fill:#fff4d8;stroke:#b17800;stroke-width:4}
      .guide{stroke:#0b63ce;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .front{stroke:#9aa8b8;stroke-dasharray:8 7;stroke-width:2}
    </style>
  </defs>

  <text x="40" y="45" class="title">Qualification setup — external front corner brackets</text>
  <text x="40" y="73" class="small">Front view. Grey rectangle = frame. L-brackets lie completely outside the front face.</text>

  <!-- Frame -->
  <rect x="235" y="135" width="490" height="330" rx="4" class="frame"/>
  <line x1="235" y1="125" x2="725" y2="125" class="front"/>
  <text x="735" y="130" class="small">front face</text>

  <!-- Four L brackets -->
  <path d="M235 135 H355 V175 H275 V255 H235 Z" class="bracket"/>
  <path d="M725 135 H605 V175 H685 V255 H725 Z" class="bracket"/>
  <path d="M725 465 H605 V425 H685 V345 H725 Z" class="bracket"/>
  <path d="M235 465 H355 V425 H275 V345 H235 Z" class="bracket"/>

  <!-- Parent anchors -->
  <circle cx="235" cy="135" r="9" class="anchor"/>
  <circle cx="725" cy="135" r="9" class="anchor"/>
  <circle cx="725" cy="465" r="9" class="anchor"/>
  <circle cx="235" cy="465" r="9" class="anchor"/>

  <text x="64" y="128" class="label">FRONT_TOP_LEFT</text>
  <line x1="213" y1="132" x2="135" y2="132" class="guide"/>
  <text x="742" y="128" class="label">FRONT_TOP_RIGHT</text>
  <text x="742" y="470" class="label">FRONT_BOTTOM_RIGHT</text>
  <text x="56" y="470" class="label">FRONT_BOTTOM_LEFT</text>

  <!-- Child mount anchor on TL -->
  <rect x="226" y="126" width="18" height="18" class="mount"/>
  <text x="72" y="205" class="label">child "mount"</text>
  <text x="72" y="228" class="small">origin = bracket outer corner</text>
  <line x1="214" y1="197" x2="232" y2="145" class="guide"/>

  <!-- Local axes at mount -->
  <line x1="235" y1="135" x2="325" y2="135" class="guide"/>
  <text x="330" y="140" class="label">local +X</text>
  <text x="330" y="163" class="small">horizontal L arm</text>

  <line x1="235" y1="135" x2="235" y2="225" class="guide"/>
  <text x="245" y="215" class="label">local −Z</text>
  <text x="245" y="238" class="small">vertical L arm</text>

  <!-- Front/outside note -->
  <g transform="translate(555,510)">
    <text x="0" y="0" class="label">Side/depth condition</text>
    <text x="0" y="28" class="small">frame front: y = −15</text>
    <text x="0" y="50" class="small">bracket: y = −19 … −15</text>
    <text x="0" y="72" class="small">→ touches front, never penetrates frame</text>
  </g>

  <g transform="translate(56,525)">
    <text x="0" y="0" class="label">What this proves</text>
    <text x="0" y="27" class="small">The same child mount is reused four times.</text>
    <text x="0" y="49" class="small">Each parent corner supplies the required rotation/mirroring.</text>
    <text x="0" y="71" class="small">After width/height mutation, all four remain on their own outer corner.</text>
  </g>
</svg>